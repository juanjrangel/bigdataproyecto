# Configuración común del clúster Spark standalone (montada en /opt/spark/conf)
spark.master                          spark://spark-master:7077
spark.driver.host                     spark-client
spark.driver.bindAddress              0.0.0.0
spark.driver.memory                   2g
spark.driver.maxResultSize            1g
spark.executor.memory                 4g
spark.executor.cores                  6
spark.serializer                      org.apache.spark.serializer.KryoSerializer
spark.sql.adaptive.enabled            true
spark.sql.session.timeZone            UTC
spark.local.dir                       /tmp/spark-local
# Event log -> Spark History Server (evidencia de jobs, stages y DAGs)
spark.eventLog.enabled                true
spark.eventLog.dir                    file:/opt/lake/spark-events
spark.history.fs.logDirectory         file:/opt/lake/spark-events
spark.history.ui.port                 18080
